name: PITVIPER CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: pitviper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_build_construct:
    name: 🐍 Test, Build & Construct
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install SDL2 system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev

      - name: Go Tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/...

      - name: Build pitviper binary (Linux)
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go build -o pitviper ./cmd/pitviper
          echo "Build OK: $(ls -lh pitviper)"

      # Founder real-time, 2026-08-25: wants pitviper installable via
      # https://github.com/marcosnils/bin (a raw-binary GitHub-release
      # installer, no package-manager dependency resolution) -- "we are
      # gonna need to link sdl2 in or whatever? i dunno how that works".
      # Real gap this closes: `ldd pitviper` on a plain CGO_ENABLED=1
      # build shows a direct dynamic dependency on libSDL2-2.0.so.0 and
      # libSDL2_ttf-2.0.so.0, neither of which is installed on a typical
      # fresh Linux machine (they're dev/runtime packages, not base-OS).
      # A `bin`-installed binary with no dependency resolution would just
      # fail to launch there. Fix: bundle those two .so files alongside
      # the binary and patch its RPATH to $ORIGIN/lib (via patchelf) so
      # it finds them next to itself, the same problem Windows already
      # solves via DLL bundling below -- same idea, Linux mechanism.
      #
      # Deliberately NOT bundling the full transitive closure (`ldd`
      # shows 50+ libraries once X11/Wayland/ALSA/PulseAudio/DBus/
      # systemd/FreeType/HarfBuzz and their own dependencies are
      # counted) -- those are base desktop-Linux libraries every
      # graphical application already assumes present (the same
      # assumption virtually every SDL2 game distributed on Linux
      # makes; a fully static, zero-host-dependency SDL2+X11 binary is
      # a real, much bigger undertaking -- not attempted here). Bundling
      # just the two SDL2-family libraries covers the actual gap (game-
      # dev runtime libs a fresh machine is genuinely unlikely to have)
      # without pretending to solve hermetic Linux binary distribution
      # in general.
      - name: Bundle SDL2 runtime libraries for standalone distribution
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y patchelf
          mkdir -p lib
          cp /usr/lib/x86_64-linux-gnu/libSDL2-2.0.so.0 lib/
          cp /usr/lib/x86_64-linux-gnu/libSDL2_ttf-2.0.so.0 lib/
          patchelf --set-rpath '$ORIGIN/lib' pitviper
          echo "RPATH set: $(patchelf --print-rpath pitviper)"
          echo "Bundled libs:" && ls -lh lib/

      - name: Generate Construct Bundle
        shell: bash
        run: |
          set -euo pipefail
          OUT="PITVIPER_CONSTRUCT.txt"
          {
            echo "PITVIPER CONSTRUCT ${{ github.run_number }}"
            echo "commit: $GITHUB_SHA"
            echo "generated_utc: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo
          } > "$OUT"

          while IFS= read -r relpath; do
            {
              echo "--- FILE START: ${relpath} ---"
              cat "${relpath}"
              echo
              echo "--- FILE END: ${relpath} ---"
              echo
            } >> "$OUT"
          done < <(
            find . \
              \( \
                -path './.git' \
                -o -path './vendor' \
                -o -path './dist' \
                -o -path './build' \
                -o -path './artifacts' \
                -o -path './tmp' \
              \) -prune -o \
              -type f \
              \( \
                -name '*.go' -o -name '*.mod' -o -name '*.sum' -o \
                -name '*.md' -o -name '*.txt' -o -name '*.sh' -o \
                -name '*.yaml' -o -name '*.yml' -o -name '*.toml' -o \
                -name 'Makefile' -o -name '.gitignore' \
              \) \
              ! -name "$OUT" \
              -print | sed 's#^./##' | LC_ALL=C sort
          )

          test -s "$OUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pitviper-linux-${{ github.run_number }}-${{ github.sha }}
          path: |
            pitviper
            lib/
            PITVIPER_CONSTRUCT.txt
          if-no-files-found: error

  build_windows:
    name: 🪟 Build Windows Binary
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      # go-sdl2 needs cgo against a real SDL2 dev toolchain; MSYS2/MinGW64
      # provides SDL2 + a matching gcc + Go all in one consistent
      # toolchain, which avoids the GOROOT/gcc-ABI mismatches you get
      # trying to mix actions/setup-go's native Go with a separate mingw
      # install. Same reasoning as SHANKPIT's release.yml, adapted for Go
      # instead of raw C: one self-consistent toolchain, not two bolted
      # together.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-go
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_ttf

      - name: Build pitviper.exe
        run: |
          set -euo pipefail
          export CGO_ENABLED=1
          go build -o pitviper.exe ./cmd/pitviper
          ls -lh pitviper.exe

      - name: Bundle with required DLLs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp pitviper.exe dist/
          # SDL2.dll (and friends) are dynamically linked — ldd lists every
          # MSYS2-provided DLL the binary actually needs so the zip is
          # self-contained on a machine without MSYS2 installed.
          for dll in $(ldd pitviper.exe | grep -i '/mingw64/bin/' | awk '{print $3}'); do
            cp "$dll" dist/
          done
          printf '%s\r\n' "pitviper.exe" > dist/RUN.bat

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pitviper-windows-${{ github.run_number }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  # Founder real-time, 2026-08-21: "whenever a build passes release it as
  # a minor version" -> "like a . bump" -> "i will handle big bumps to
  # signify human verify releases" -> "start pushing the artifacts to
  # releases in github" -> "for parena and pitviper" -> "pitviper is not
  # pre release" / "pitviper is release release" (unlike PARENA, which is
  # still pre-1.0 -- PITVIPER's own real, already-shipped code, per this
  # repo's own README status note, is a real release track). Runs only
  # after BOTH platform builds succeed, only on a real push to main (not
  # PRs, not other branches, not the tag-push this job's own release step
  # triggers) -- auto-bumps the MINOR version only, same real "major is
  # the founder's own manual call" split PARENA's own workflow uses.
  release:
    name: 🚀 Tag & Release
    runs-on: ubuntu-latest
    needs: [test_build_construct, build_windows]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 -- need the full tag history to find the current
      # version; actions/checkout's own default shallow clone doesn't
      # reliably include tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: pitviper-linux-${{ github.run_number }}-${{ github.sha }}
          path: dist/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: pitviper-windows-${{ github.run_number }}-${{ github.sha }}
          path: dist/windows

      - name: Package release assets
        run: |
          set -euo pipefail
          chmod +x dist/linux/pitviper
          # Includes lib/ (bundled libSDL2/libSDL2_ttf, RPATH already set
          # to $ORIGIN/lib at build time) so the tarball is a real
          # standalone install, not just the binary -- see this
          # workflow's own "Bundle SDL2 runtime libraries" step comment.
          tar -czf pitviper-linux-x86_64.tar.gz -C dist/linux pitviper lib
          (cd dist/windows && zip -r ../../pitviper-windows-x86_64.zip .)

      - name: Compute next minor version
        id: version
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            major=0
            minor=0
          else
            ver="${latest#v}"
            major="$(echo "$ver" | cut -d. -f1)"
            minor="$(echo "$ver" | cut -d. -f2)"
          fi
          next_minor=$((minor + 1))
          next="v${major}.${next_minor}.0"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"
          gh release create "$NEXT_VERSION" \
            pitviper-linux-x86_64.tar.gz \
            pitviper-windows-x86_64.zip \
            --title "$NEXT_VERSION" \
            --generate-notes
